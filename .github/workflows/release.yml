name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: automated-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: windows-latest
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Choose next patch version
        id: next-version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const parse = (value) => {
              const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(value || '');
              return match ? match.slice(1).map(Number) : null;
            };
            const versions = releases.data
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => parse(release.tag_name))
              .filter(Boolean)
              .sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            const current = versions[0] || parse(packageVersion);
            if (!current) throw new Error(`Cannot determine a release version from ${packageVersion}`);
            current[2] += 1;
            core.setOutput('tag', `v${current.join('.')}`);

      - name: Set release version in build metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          npm version $version --no-git-tag-version --ignore-scripts
          foreach ($path in @('src-tauri/Cargo.toml', 'src-tauri/core/Cargo.toml')) {
            $contents = Get-Content -LiteralPath $path -Raw
            $updated = [regex]::Replace($contents, '(?m)^version = "[^"]+"', "version = `"$version`"", 1)
            if ($updated -eq $contents) { throw "Could not update version in $path" }
            Set-Content -LiteralPath $path -Value $updated -NoNewline
          }
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable Windows executable
        run: npm run tauri:build:exe

      - name: Package release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $name = "Studio-Clone-$env:RELEASE_TAG-windows-x64"
          Copy-Item src-tauri/target/release/studio-clone.exe "release/$name.exe"
          Compress-Archive -Path "release/$name.exe", README.md -DestinationPath "release/$name.zip" -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next-version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Studio Clone ${{ steps.next-version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          body: |
            Studio Clone desktop DAW preview.

            Windows
            - Portable executable: `Studio-Clone-${{ steps.next-version.outputs.tag }}-windows-x64.exe`
            - Portable ZIP with README: `Studio-Clone-${{ steps.next-version.outputs.tag }}-windows-x64.zip`
            - Requires Microsoft Edge WebView2 Runtime.

            This build targets currently supported Windows versions. Windows 7 is not supported by the current Tauri/WebView2 toolchain.
            See README.md for the full list of limitations.
          files: release/*
          fail_on_unmatched_files: true
