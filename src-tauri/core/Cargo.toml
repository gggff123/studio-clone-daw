[package]
name = "studio-core"
version = "0.1.0"
description = "Audio engine, project model, and MIDI support for Studio Clone"
authors = ["Studio Clone"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "studio_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
cpal = "0.18.2"
symphonia = { version = "0.5.4", features = ["all"] }
hound = "3.5.1"
midir = "0.11.1"
midly = "0.5.3"
arc-swap = "1.9.3"
crossbeam-channel = "0.5"
dirs = "6"
