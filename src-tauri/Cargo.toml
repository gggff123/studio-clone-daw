[package]
name = "studio-clone"
version = "0.1.0"
description = "Cubase Pro 12-inspired DAW"
authors = ["Studio Clone"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "studio_clone_lib"
# The GNU linker overflows its export ordinal table when linking a cdylib with
# the full Tauri dependency graph on Windows. Desktop builds only need an rlib.
crate-type = ["staticlib", "rlib"]

[workspace]
members = [".", "core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
studio-core = { path = "core" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
